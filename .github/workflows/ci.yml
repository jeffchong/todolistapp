name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Unit Tests
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild build \
            -project ToDoListApp.xcodeproj \
            -scheme ToDoListApp \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/ToDoListAppDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: swift test
